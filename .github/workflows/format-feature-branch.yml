name: Format PR branch
on:
  push:
    branches: [feat/live-workload-log-membership]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-workload-log-membership
      - name: Apply gofmt
        run: |
          gofmt -w internal/app/logs_view.go internal/app/model.go internal/app/palette.go internal/app/workload_logs.go internal/app/related.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app
          if ! git diff --cached --quiet; then
            git commit -m "style: format live membership implementation"
            git push origin HEAD:feat/live-workload-log-membership
          fi
