name: format feature branch
on:
  push:
    branches: [feat/resource-drilldown-aggregated-logs]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resource-drilldown-aggregated-logs
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and commit Go code
        run: |
          gofmt -w internal/app/model.go internal/app/related.go internal/app/logs_view.go internal/app/service_workloads.go internal/app/workload_logs.go internal/app/model_test.go internal/app/keymap.go internal/app/resource_view.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app
          if ! git diff --cached --quiet; then
            git commit -m "style: gofmt feature implementation"
            git push origin HEAD:feat/resource-drilldown-aggregated-logs
          fi
